[project]
name = "archi-research-harness"
version = "0.1.0"
description = "Harness agéntico para revisión sistemática de literatura y validación estratégica de ideas de papers (JCR/Scopus Q1/Q2)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "pydantic>=2.6.0",
    "rich>=13.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skills"]
