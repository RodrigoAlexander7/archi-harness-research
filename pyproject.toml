[project]
name = "archi-research-harness"
version = "0.3.0"
description = "Harness agéntico de investigación con skills comunitarias validadas (K-Dense, Orchestra Research, GPT-Researcher, last30days)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "pydantic>=2.6.0",
    "rich>=13.7.0",
    "matplotlib>=3.8.0",
    "numpy>=1.24.0",
    "bibtexparser>=2.0.0",
    "gpt-researcher>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skills"]
